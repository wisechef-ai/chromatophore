[pytest]
testpaths = tests

# WHY BOTH SETTINGS ARE REQUIRED (measured: either one alone => 76 collection errors)
#
# The repo root IS the package (Hermes imports a plugin directory as the module), and
# after the rename that directory is `cuttlefish-theme` — a hyphen, which is not a
# legal Python module name.
#
#   --import-mode=importlib      stops pytest importing test modules by deriving a
#                                dotted name from their path.
#   consider_namespace_packages  stops pytest walking UP from conftest.py, finding
#                                the root __init__.py, and trying to import the
#                                package by directory basename anyway.
#
# Production never hits this: plugins_loader._directory_module_name() slugifies the
# manifest key (`.replace("-", "_")`) and binds the module explicitly through
# spec_from_file_location, so Hermes loads us as `hermes_plugins.cuttlefish_theme`.
# Hyphenated plugin directories are the norm there (agent-sync-guard, evey-goals).
# These two lines simply make the test harness agree with the real loader.
addopts = --import-mode=importlib
consider_namespace_packages = true
